# feat_geo_sys_sample.toml is a test data file containing a set of sample feature specifications.

# Comments here are to explain the test file structure, since this was the first feature spec.
[samplesketches] # Data category name, like sketch_samples, incomplete_sketches
[samplesketches.2d_point_and_line]
# The name of the system by default will be the name of the sketch with '_system' appended
# The name of the pose by default will be the name of the sketch with '_pose' appended
type = "sketch"
# Type and name are the only parameters common to all Features.
# Sketch parameters: pose, geometry, and constraints
# Sketch poses are always poses, so the type is not stated here
pose = {vectors = {origin = [0, 0, 0]}, quats = {rotation = {angle=0, axis = [1, 0, 0]}}}

[samplesketches.2d_point_and_line.geometry.line] # Name can be used or ignored by test
type = "line"
# Use the GeometrySampleData system, but with standardized names
vectors = {point = [0, 0], direction = [1, 0]}

[samplesketches.2d_point_and_line.geometry.point]
type = "point"
# All geometry will have 'construction' settings, but it will default to False unless set to 'true'
vectors = {vector = [0, 0]}

[samplesketches.2d_point_and_line.constraints.coincident] # Name can be used or ignored by test
type = "coincident"
# Names must be synced with the geometry table. The '::' separates the name from the reference.
geometry = ["line::core", "point::core"]

[samplesketches.2d_point_and_line.constraints.line_angle_to_x]
type = "angle"
geometry = ["x", "line::core"]
# All currently supported value constraints can just use 'value', but future constraints like
# rotation constraints may require quaternions or vectors.
degree_scalars = {value = 45} # Use the GeometrySampleData system with standardized names.
quadrant = 4

[solvesketches]
    [solvesketches.2_points] # Two points defined in this file, held coincident.
        type = "sketch"
        pose = {vectors = {origin = [0, 0, 0]}, quats = {rotation = {angle=0, axis = [1, 0, 0]}}}
        [solvesketches.2_points.geometry]
            [solvesketches.2_points.geometry.point_0]
                type = "point"
                vectors = {vector = [0, 0]}
            [solvesketches.2_points.geometry.point_1]
                type = "point"
                vectors = {vector = [1, 1]}
        [solvesketches.2_points.constraints]
            [solvesketches.2_points.constraints.fix_point]
                type = "fixed"
                geometry = ["point_0"]
            [solvesketches.2_points.constraints.points_coincident]
                type = "coincident"
                geometry = ["point_0", "point_1"]
    [solvesketches.point_to_origin] # A single point held coincident to the system's origin
        type = "sketch"
        pose = {vectors = {origin = [0, 0, 0]}, quats = {rotation = {angle=0, axis = [1, 0, 0]}}}
        [solvesketches.point_to_origin.geometry]
            [solvesketches.point_to_origin.geometry.point]
            type = "point"
            vectors = {vector = [1, 1]}
        [solvesketches.point_to_origin.constraints]
            [solvesketches.point_to_origin.constraints.points_coincident]
                type = "coincident"
                geometry = ["origin", "point"]
