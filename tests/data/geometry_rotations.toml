[[axis]]
# Rotations for Axis Elements
start = [0, 0, 0]
direction = [1, 0, 0]
quat_rotations = [
    {quat = "zero_axis_0", ref_point = [0, 0, 0], direction = [1, 0, 0]},
    {quat = "x_0", ref_point = [0, 0, 0], direction = [1, 0, 0]},
    {quat = "x_90", ref_point = [0, 0, 0], direction = [1, 0, 0]}, # Rotates X around X
    {quat = "y_90", ref_point = [0, 0, 0], direction = [0, 0, -1]},
    {quat = "y_negative_90", ref_point = [0, 0, 0], direction = [0, 0, 1]},
    {quat = "y_270", ref_point = [0, 0, 0], direction = [0, 0, 1]},
    {quat = "y_180", ref_point = [0, 0, 0], direction = [-1, 0, 0]},
    {quat = "y_135", ref_point = [0, 0, 0], direction = [-1, 0, -1]},
]

[[axis]]
start = [0, 0, 0]
direction = [0, 0, 1]
quat_rotations = [
    {quat = "y_135", ref_point = [0, 0, 0], direction = [1, 0, -1]},
]