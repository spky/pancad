# data_geo_util_sample.toml is a test data file containing geometry definitions for testing the
# pancad geometry utilities with.

[closest_to_origin]
[closest_to_origin.2d_origin_x_vector]
vectors = {point = [0, 0], direction = [1, 0], expected = [0, 0]}
[closest_to_origin.3d_origin_x_vector]
vectors = {point = [0, 0, 0], direction = [1, 0, 0], expected = [0, 0, 0]}
[closest_to_origin.2d_point_vector_parallel_to_direction]
vectors = {point = [2, 0], direction = [1, 0], expected = [0, 0]}
[closest_to_origin.2d_point_vector_perpendicular_to_direction]
vectors = {point = [1, 1], direction = [-1, 1], expected = [1, 1]}
[closest_to_origin.2d_point_clockwise_direction_upper_left]
vectors = {point = [2, 0], direction = [-1, 1], expected = [1, 1]}
[closest_to_origin.2d_point_clockwise_direction_bottom_right]
vectors = {point = [2, 0], direction = [1, -1], expected = [1, 1]}
[closest_to_origin.2d_point_counterclockwise_direction_upper_left]
vectors = {point = [0, 2], direction = [-1, 1], expected = [1, 1]}
[closest_to_origin.2d_point_counterclockwise_direction_bottom_right]
vectors = {point = [0, 2], direction = [1, -1], expected = [1, 1]}

[get_rotation_quat]
[get_rotation_quat.unrotated_x]
normed_vectors = {start = [1, 0, 0], target = [1, 0, 0]}
[get_rotation_quat.unrotated_y]
normed_vectors = {start = [0, 1, 0], target = [0, 1, 0]}
[get_rotation_quat.unrotated_z]
normed_vectors = {start = [0, 0, 1], target = [0, 0, 1]}
[get_rotation_quat.x_to_negative_x]
normed_vectors = {start = [1, 0, 0], target = [-1, 0, 0]}
[get_rotation_quat.x_to_y]
normed_vectors = {start = [1, 0, 0], target = [0, 1, 0]}
[get_rotation_quat.x_to_1_1_0]
normed_vectors = {start = [1, 0, 0], target = [1, 1, 0]}
[get_rotation_quat.x_to_n1_n1_0]
normed_vectors = {start = [1, 0, 0], target = [-1, -1, 0]}
[get_rotation_quat.1_1_1_to_n1_n1_n1]
normed_vectors = {start = [1, 1, 1], target = [-1, -1, -1]}

[unique_vector]
# 2D/3D Zero Vectors
[unique_vector.2d_zero_vector]
vectors = {input = [0, 0], result = [0, 0]}
[unique_vector.3d_zero_vector]
vectors = {input = [0, 0, 0], result = [0, 0, 0]}

# 2D Axis Vectors
[unique_vector.2d_x]
vectors = {input = [1, 0], result = [1, 0]}
[unique_vector.2d_negative_x]
vectors = {input = [-1, 0], result = [1, 0]}
[unique_vector.2d_y]
vectors = {input = [0, 1], result = [0, 1]}
[unique_vector.2d_negative_y]
vectors = {input = [0, -1], result = [0, 1]}

# 2D Ones Vectors
[unique_vector.2d_ones_vector]
vectors = {input = [1, 1], result = [1, 1]}
[unique_vector.2d_ones_vector_x_negative]
vectors = {input = [-1, 1], result = [-1, 1]}
[unique_vector.2d_ones_vector_y_negative]
vectors = {input = [1, -1], result = [-1, 1]}

# 3D Axis Vectors
[unique_vector.3d_x]
vectors = {input = [1, 0, 0], result = [1, 0, 0]}
[unique_vector.3d_negative_x]
vectors = {input = [-1, 0, 0], result = [1, 0, 0]}
[unique_vector.3d_y]
vectors = {input = [0, 1, 0], result = [0, 1, 0]}
[unique_vector.3d_negative_y]
vectors = {input = [0, -1, 0], result = [0, 1, 0]}
[unique_vector.3d_z]
vectors = {input = [0, 0, 1], result = [0, 0, 1]}
[unique_vector.3d_negative_z]
vectors = {input = [0, 0, -1], result = [0, 0, 1]}

# 3D Ones Vectors
[unique_vector.3d_ones_vector]
vectors = {input = [1, 1, 1], result = [1, 1, 1]}
[unique_vector.3d_ones_vector_z_negative]
vectors = {input = [1, 1, -1], result = [-1, -1, 1]}
[unique_vector.3d_ones_vector_y_negative]
vectors = {input = [1, -1, 1], result = [1, -1, 1]}
[unique_vector.3d_ones_vector_x_negative]
vectors = {input = [-1, 1, 1], result = [-1, 1, 1]}

[residual_unique_vector]
[residual_unique_vector.3d_x_axis]
vectors = {input = [1, 0, 0], result = [0, 0, 0]}
[residual_unique_vector.3d_y_axis]
vectors = {input = [0, 1, 0], result = [0, 0, 0]}
[residual_unique_vector.3d_z_axis]
vectors = {input = [0, 0, 1], result = [0, 0, 0]}
[residual_unique_vector.3d_negative_x]
vectors = {input = [-1, 0, 0], result = [-2, 0, 0]}
[residual_unique_vector.3d_negative_y]
vectors = {input = [0, -1, 0], result = [0, -2, 0]}
[residual_unique_vector.3d_negative_z]
vectors = {input = [0, 0, -1], result = [0, 0, -2]}
[residual_unique_vector.3d_ones_vector]
vectors = {input = [1, 1, 1], result = [0, 0, 0]}
[residual_unique_vector.3d_negative_ones_vector]
vectors = {input = [-1, -1, -1], result = [-2, -2, -2]}

# Quaternions
[quats]
[quats.from_angle]
[quats.from_angle.unrotated_zero_axis]
vectors = {axis = [1, 0, 0], vector = [0, 0, 0]}
degree_scalars = {angle = 0}
scalars = {scalar = 1}
[quats.from_angle.90_around_x]
vectors = {axis = [1, 0, 0], vector = [0.7071068, 0, 0]}
degree_scalars = {angle = 90}
scalars = {scalar = 0.7071068}