# geometry_samples.toml is a test data file containing geometry definition samples. The intent
# of storing the geometry definitions in this file allows the test implementations to be easier
# to read and maintain.

# Lines defined by two points.
#     desc: A short description of the parameters.
#     start: The first point.
#     end: The second point. Must be the same dimension as start.
#     ref_point: The expected resulting point closest to the origin.
#     unique_direction: The expected unique direction of the line - must be normalized at runtime.
#     polar_spherical: Optional - the expected polar (2D) or spherical (3D) direction vector.
[[two_point_lines]]
desc = "Diagonal Off-Origin Quadrant 2"
vectors = {start = [0, 4], end = [-4, 0], ref_point = [-2, 2], unique_direction = [1, 1]}

[[two_point_lines]]
desc = "Diagonal Off-Origin Quadrant 3"
vectors = {start = [0, -4], end = [-4, 0], ref_point = [-2, -2], unique_direction = [-1, 1]}

[[two_point_lines]]
desc = "Diagonal Off-Origin Quadrant 4"
vectors = {start = [0, -4], end = [4, 0], ref_point = [2, -2], unique_direction = [1, 1]}

[[two_point_lines]]
desc = "Vertical Line Through Origin"
vectors = {start = [0, 0], end = [0, 2], ref_point = [0, 0], unique_direction = [0, 1]}

[[two_point_lines]]
desc = "Vertical Line Positive X"
vectors = {start = [2, 0], end = [2, 2], ref_point = [2, 0], unique_direction = [0, 1]}

[[two_point_lines]]
desc = "Vertical Line Negative X"
vectors = {start = [-2, 0], end = [-2, 2], ref_point = [-2, 0], unique_direction = [0, 1]}

[[two_point_lines]]
desc = "Horizontal Line Through Origin"
vectors = {start = [0, 0], end = [2, 0], ref_point = [0, 0], unique_direction = [1, 0]}

[[two_point_lines]]
desc = "Horizontal Line Positive Y"
vectors = {start = [0, 2], end = [2, 2], ref_point = [0, 2], unique_direction = [1, 0]}

[[two_point_lines]]
desc = "Horizontal Line Negative Y"
vectors = {start = [0, -2], end = [2, -2], ref_point = [0, -2], unique_direction = [1, 0]}

[[two_point_lines]]
desc = "Diagonal Init in Quadrant 1 Thru Origin"
vectors = {start = [1, 1], end = [2, 2], ref_point = [0, 0], unique_direction = [1, 1]}

[[two_point_lines]]
desc = "Diagonal Init in Quadrant 2 Thru Origin"
vectors = {start = [-1, 1], end = [-2, 2], ref_point = [0, 0], unique_direction = [-1, 1]}

[[two_point_lines]]
desc = "Diagonal Init in Quadrant 3 Thru Origin"
vectors = {start = [-1, -1], end = [-2, -2], ref_point = [0, 0], unique_direction = [1, 1]}

[[two_point_lines]]
desc = "Diagonal Init in Quadrant 4 Thru Origin"
vectors = {start = [1, -1], end = [2, -2], ref_point = [0, 0], unique_direction = [-1, 1]}

[[two_point_lines]]
desc = "Diagonal Init From Quadrant 3 to 1"
vectors = {start = [-1, -1], end = [1, 1], ref_point = [0, 0], unique_direction = [1, 1]}

[[two_point_lines]]
desc = "Diagonal Init From Quadrant 2 to 4"
vectors = {start = [-1, 1], end = [1, -1], ref_point = [0, 0], unique_direction = [-1, 1]}

[[two_point_lines]]
desc = "X Axis 3D"
vectors = {start = [0, 0, 0], end = [1, 0, 0], ref_point = [0, 0, 0], unique_direction = [1, 0, 0], polar_spherical = [1, 0, 90]}

[[two_point_lines]]
desc = "Y Axis 3D"
vectors = {start = [0, 0, 0], end = [0, 1, 0], ref_point = [0, 0, 0], unique_direction = [0, 1, 0], polar_spherical = [1, 90, 90]}

[[two_point_lines]]
desc = "Z Axis 3D"
vectors = {start = [0, 0, 0], end = [0, 0, 1], ref_point = [0, 0, 0], unique_direction = [0, 0, 1], polar_spherical = [1, "nan", 0]}

# Lines defined by a start point and a direction vector.
#     desc: An optional short description of the parameters.
#     start: The first point.
#     in_direction: The direction input into the Line. Must be the same dimension as start
#     ref_point: The expected resulting point closest to the origin.
#     unique_direction: The expected unique direction of the line - must be normalized at runtime.
# 2D point_direction_lines
[[point_direction_lines]]
desc = "Positive X 2D Unit Vector"
vectors = {start = [0, 0], in_direction = [1, 0], unique_direction = [1, 0], ref_point = [0, 0]}

[[point_direction_lines]]
desc = "Positive Y 2D Unit Vector"
vectors = {start = [0, 0], in_direction = [0, 1], unique_direction = [0, 1], ref_point = [0, 0]}

[[point_direction_lines]]
desc = "Negative X 2D Unit Vector"
vectors = {start = [0, 0], in_direction = [-1, 0], unique_direction = [1, 0], ref_point = [0, 0]}

[[point_direction_lines]]
desc = "Negative Y 2D Unit Vector"
vectors = {start = [0, 0], in_direction = [0, -1], unique_direction = [0, 1], ref_point = [0, 0]}

[[point_direction_lines]]
desc = "2 Direction Positive 2D Vector"
vectors = {start = [0, 0], in_direction = [1, 1], unique_direction = [1, 1], ref_point = [0, 0]}

[[point_direction_lines]]
desc = "2 Direction Negative 2D Vector"
vectors = {start = [0, 0], in_direction = [-1, -1], unique_direction = [1, 1], ref_point = [0, 0]}

# 3D point_direction_lines
[[point_direction_lines]]
desc = "Positive X 3D Unit Vector"
vectors = {start = [0, 0, 0], in_direction = [1, 0, 0], unique_direction = [1, 0, 0], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "Positive Y 3D Unit Vector"
vectors = {start = [0, 0, 0], in_direction = [0, 1, 0], unique_direction = [0, 1, 0], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "Positive Z 3D Unit Vector"
vectors = {start = [0, 0, 0], in_direction = [0, 0, 1], unique_direction = [0, 0, 1], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "Negative X 3D Unit Vector"
vectors = {start = [0, 0, 0], in_direction = [-1, 0, 0], unique_direction = [1, 0, 0], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "Negative Y 3D Unit Vector"
vectors = {start = [0, 0, 0], in_direction = [0, -1, 0], unique_direction = [0, 1, 0], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "Negative Z 3D Unit Vector"
vectors = {start = [0, 0, 0], in_direction = [0, 0, -1], unique_direction = [0, 0, 1], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "2 Direction XY Positive 3D Vector"
vectors = {start = [0, 0, 0], in_direction = [1, 1, 0], unique_direction = [1, 1, 0], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "2 Direction YZ Positive 3D Vector"
vectors = {start = [0, 0, 0], in_direction = [0, 1, 1], unique_direction = [0, 1, 1], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "2 Direction XY Negative 3D Vector"
vectors = {start = [0, 0, 0], in_direction = [-1, -1, 0], unique_direction = [1, 1, 0], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "2 Direction YZ Negative 3D Vector"
vectors = {start = [0, 0, 0], in_direction = [0, -1, -1], unique_direction = [0, 1, 1], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "3 Direction Positive 3D Vector"
vectors = {start = [0, 0, 0], in_direction = [1, 1, 1], unique_direction = [1, 1, 1], ref_point = [0, 0, 0]}

[[point_direction_lines]]
desc = "3 Direction Negative 3D Vector"
vectors = {start = [0, 0, 0], in_direction = [-1, -1, -1], unique_direction = [1, 1, 1], ref_point = [0, 0, 0]}

# 2D Lines defined by a slope and y intercept
#     desc: An optional short description of the parameters.
#     slope: The slope of the 2D line.
#     intercept: The y-intercept of the line.
#     ref_point: The expected resulting point closest to the origin.
#     unique_direction: The expected unique direction of the line - must be normalized at runtime.
[[slope_y_intercept_lines]]
desc = "Horizontal Thru Origin"
vectors = {ref_point = [0, 0], unique_direction = [1, 0]}
scalars = {slope = 0, intercept = 0}

[[slope_y_intercept_lines]]
desc = "Slope 1 Thru Origin"
vectors = {ref_point = [0, 0], unique_direction = [1, 1]}
scalars = {slope = 1, intercept = 0}

[[slope_y_intercept_lines]]
desc = "Slope -1 Thru Origin"
vectors = {ref_point = [0, 0], unique_direction = [-1, 1]}
scalars = {slope = -1, intercept = 0}

[[slope_y_intercept_lines]]
desc = "Slope -1 Intercept 4"
vectors = {ref_point = [2, 2], unique_direction = [-1, 1]}
scalars = {slope = -1, intercept = 4}

# Lines defined by a point, azimuth angle phi, and elevation angle theta (if 3D)
#     desc: An optional short description of the parameters.
#     start: The first point.
#     phi: The azimuth angle in degrees
#     theta: The elevation angle in degrees
#     ref_point: The expected resulting point closest to the origin.
#     unique_direction: The expected unique direction of the line - must be normalized at runtime.
[[point_angle_lines]]
desc = "Polar Origin 0"
vectors = {start = [0, 0], ref_point = [0, 0], unique_direction = [1, 0], polar_spherical = [1, 0]}
scalars = {phi = 0}

[[point_angle_lines]]
desc = "Polar Origin 45"
