# data_line_sample.toml is a test data file containing line definition samples.

# Lines defined by two points.
#     start: The first point.
#     end: The second point. Must be the same dimension as start.
#     ref_point: The expected resulting point closest to the origin.
#     unique_direction: The expected unique direction of the line - must be normalized at runtime.
#     polar_spherical: Optional - the expected polar (2D) or spherical (3D) direction vector.
[two_point_lines.diagonal_off_origin_quadrant_1]
vectors = {start = [0, 4], end = [4, 0], ref_point = [2, 2]}
normed_vectors = {unique_direction = [-1, 1]}

[two_point_lines.diagonal_off_origin_quadrant_2]
vectors = {start = [0, 4], end = [-4, 0], ref_point = [-2, 2]}
normed_vectors = {unique_direction = [1, 1]}

[two_point_lines.diagonal_off_origin_quadrant_3]
